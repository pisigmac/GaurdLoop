apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardloop-backend
  namespace: guardloop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: guardloop-backend
  template:
    metadata:
      labels:
        app: guardloop-backend
    spec:
      containers:
        - name: backend
          image: guardloop/backend:v1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: guardloop-config
          envFrom:
            - secretRef:
                name: guardloop-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: guardloop-backend-service
  namespace: guardloop
spec:
  selector:
    app: guardloop-backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: guardloop-backend-hpa
  namespace: guardloop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: guardloop-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

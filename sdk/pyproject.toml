[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardloop-sdk"
version = "1.0.0"
description = "GuardLoop Python SDK — Agent Trust & Orchestration Layer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GuardLoop"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["guardloop_sdk*"]
